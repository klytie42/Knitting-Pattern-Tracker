<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Knitting Pattern Tracker</title>

<link rel="stylesheet" href="css/styles.css">
</head>

<body>

<div id="app">

<header>

    <div class="title">
        🧶 Knitting Tracker
    </div>

    <div class="header-buttons">

        <button id="rotateButton">
            ↻
        </button>

    </div>

</header>


<div id="controls">

    <label class="file-label">
        📄 Import PDF

        <input
            id="pdfInput"
            type="file"
            accept="application/pdf">
    </label>


    <button id="drawButton">
        ✏️ Draw
    </button>


    <button id="previousPage">
        ◀
    </button>


    <button id="nextPage">
        ▶
    </button>


    <button id="clearPage">
        🗑
    </button>


    <button id="exportButton">
        💾 Backup
    </button>


    <label class="file-label dark">

        📥 Restore

        <input
            id="importBackup"
            type="file"
            accept=".knitpattern,.json">
    </label>


    <button
        id="deleteButton"
        class="danger">

        Delete

    </button>

</div>


<div id="rowCounter">

    <span class="row-label">
        ROW
    </span>


    <button
        id="minusRow"
        class="counter-button">

        −

    </button>


    <div
        id="rowNumber"
        class="row-number">

        1

    </div>


    <button
        id="plusRow"
        class="counter-button">

        +

    </button>


    <button id="resetRow">
        Reset
    </button>

</div>


<div id="viewerFrame">

<main id="viewer">

    <div id="emptyState">

        <div class="empty-box">

            <div class="empty-icon">
                🧶
            </div>

            <h2>
                Your knitting pattern
            </h2>

            <p>
                Import a PDF pattern to get started.
                Your pattern, notes and row number
                will automatically be saved on this device.
            </p>

        </div>

    </div>


    <div id="pages"></div>

</main>

<div id="viewerScrollbarTrack">
    <div
        id="viewerScrollbarThumb"
        role="scrollbar"
        aria-label="PDF scroll position"
        aria-controls="viewer"
        aria-orientation="vertical"
        aria-valuemin="0"
        aria-valuemax="0"
        aria-valuenow="0"
        tabindex="0">
    </div>
</div>

</div>

</div>


<div id="drawingTools">

    <button
        id="penButton"
        class="active">

        ✏️

    </button>


    <button id="eraserButton">

        🧽

    </button>


    <input
        id="penColor"
        type="color"
        value="#ff3b30">


    <input
        id="brushSize"
        type="range"
        min="1"
        max="20"
        value="4">


    <button id="closeDrawing">
        Done
    </button>

</div>


<div id="saveStatus">
    Saved
</div>


<script type="module" src="js/app.js"></script>

</body>
</html>
